default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV['AZURE_DB_USERNAME'] || 'postgres' %>
  password: <%= ENV['AZURE_DB_PASSWORD'] || ENV['POSTGRES_PASSWORD'] %>
  host: <%= ENV['AZURE_DB_HOST'] || ENV['POSTGRES_HOST'] || 'localhost' %>

development:
  <<: *default
  database: <%= ENV['AZURE_DB_NAME'] || 'docuseal_dev' %>

test:
  <<: *default
  database: <%= ENV['AZURE_DB_NAME'] || 'docuseal_test' %>

production:
  <<: *default
  database: <%= ENV['AZURE_DB_NAME'] || 'docuseal' %>
  sslmode: require
