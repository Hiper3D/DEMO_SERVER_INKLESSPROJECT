version: "3.9"
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inkless_project2025-app
    ports:
      - "3000:3000"
    environment:
      RAILS_ENV: "production"
      FORCE_SSL: "true"
      APP_URL: "https://bflsign.bc-pl.com"
      RAILS_HOST: "bflsign.bc-pl.com"
      DATABASE_URL: "postgresql://bariflo:Bariflo%402401@192.168.1.199:5432/docuseal"
      SECRET_KEY_BASE: "4dce4f0685aa709f2ae930895ccb9d479700732d9f9a659aa3264af6c49de6390fb81b68aeb54dba66e44f634a93aca38555f739d96db34fb8a5d65f9"
      RUN_MIGRATIONS: "true"
      REDIS_URL: "redis://redis:6379/0"
      REDIS_TIMEOUT: "30"
      ALLOW_PUBLIC_SIGNUP: "true"
      DISABLE_SIGNUP: "false"
      SHOW_LOGIN_LINK_ON_SIGNUP: "true"
      SHOW_SIGNUP_LINK_ON_LOGIN: "true"
    depends_on:
      - redis
    command: >
      bash -c "bundle exec rails server -e production -b 0.0.0.0"
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    container_name: inkless_project2025-redis
    restart: unless-stopped
  caddy:
    image: caddy:latest
    container_name: inkless_project2025-caddy
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    depends_on:
      - app
    restart: unless-stopped
volumes:
  caddy_data:
  caddy_config:
